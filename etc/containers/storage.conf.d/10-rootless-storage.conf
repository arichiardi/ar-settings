# Silence the Podman "graphroot overrides rootless_storage_path" warning.
#
# Podman 6+ warns when graphroot is set and rootless_storage_path is also
# configured. Setting graphroot to the per-user default is a deliberate
# no-op. Each rootless user keeps its own storage directory. The warning
# disappears.
[storage]
graphroot = "$HOME/.local/share/containers/storage"
